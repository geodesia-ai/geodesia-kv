[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geodesia-kv"
version = "0.1.0"
description = "Compressione della KV cache ad allocazione certificata: contesti lunghi su GPU piccole con limite d'errore dimostrato"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Vincenzo Dentamaro", email = "vincenzodentamaro@gmail.com" }]
keywords = ["kv-cache", "llm", "inference", "quantization", "long-context"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.4", "transformers>=4.40"]

[project.optional-dependencies]
cuda = ["ninja"]
bench = ["safetensors", "numpy"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/geodesia-ai/geodesia-kv"

[tool.setuptools]
packages = ["geodesia_kv"]

[tool.setuptools.package-data]
geodesia_kv = ["../geodesia_kv_cuda/*.cu", "../geodesia_kv_cuda/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
